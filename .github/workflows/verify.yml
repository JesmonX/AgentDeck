name: Verify
on:
  pull_request:
  workflow_dispatch:
jobs:
  core-and-ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.21.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p agentdeck-core -p agentdeck-cli --all-targets -- -D warnings
      - run: cargo test -p agentdeck-core -p agentdeck-cli
      - run: python3 scripts/protocol-check.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser checks
        run: |
          pnpm web > /tmp/agentdeck-vite.log 2>&1 &
          node scripts/browser-check.mjs
        env:
          CHROME_PATH: bundled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-validation
          path: artifacts/
