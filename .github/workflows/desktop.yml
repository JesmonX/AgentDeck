name: Preview release
on:
  push:
    tags: ["v*-preview.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing preview tag to build and publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: preview-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  collectors:
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    runs-on: ubuntu-22.04
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --release -p agentdeck-cli --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      - uses: actions/upload-artifact@v4
        with:
          name: collector-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/agentdeck-collector
  desktop:
    needs: collectors
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.21.0"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: collector-x86_64-unknown-linux-gnu
          path: collectors/x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@v4
        with:
          name: collector-aarch64-unknown-linux-gnu
          path: collectors/aarch64-unknown-linux-gnu
      - run: pnpm install --frozen-lockfile
      - run: python scripts/prepare-bundle.py
      - run: pnpm exec tauri build --target ${{ matrix.target }}
        working-directory: apps/desktop
      - run: python scripts/collect-release.py "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: AgentDeck-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
  publish:
    needs: [collectors, desktop]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: AgentDeck-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: collector-*
          path: collector-assets
      - name: Assemble and publish preview
        run: |
          for arch in x86_64 aarch64; do
            install -m 755 "collector-assets/collector-${arch}-unknown-linux-gnu/agentdeck-collector" "release-assets/agentdeck-collector-${arch}-linux"
          done
          python scripts/collect-release.py --verify
          (cd release-assets && sha256sum * > SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --prerelease --draft=false --notes-file .github/preview-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --prerelease --title "AgentDeck $RELEASE_TAG" --notes-file .github/preview-notes.md
          fi
